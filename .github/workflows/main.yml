
name: Compilar Drum Practice APK

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

     
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        working-directory: DrumPractice_v07_GitHub_APK/DrumPracticeOffline
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DrumPractice-APK
          path: DrumPractice_v07_GitHub_APK/DrumPracticeOffline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
